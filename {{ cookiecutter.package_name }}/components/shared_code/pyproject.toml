[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "{{ cookiecutter.package_name }}_shared"
version = "{{ cookiecutter.version }}"
description = "Shared code for {{ cookiecutter.project_name }} tesseracts"
authors = [{ name = "{{ cookiecutter.author_name }}" }]
requires-python = ">=3.10"
dependencies = [
    # Add dependencies here
]

[tool.setuptools.packages.find]
where = ["."]
include = ["{{ cookiecutter.package_name }}_shared", "{{ cookiecutter.package_name }}_shared.*"]
