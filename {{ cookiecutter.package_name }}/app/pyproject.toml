[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "{{ cookiecutter.package_name }}"
dynamic = ["version"]
description = "{{ cookiecutter.project_short_description }}"
authors = [{ name = "{{ cookiecutter.author_name }}" }]
requires-python = ">=3.10"
dependencies = [
    "tesseract-core",
    "typer>=0.9.0",
    # Add more dependencies here
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    # For running app/chain.ipynb
    "jupyter",
    "matplotlib",
    "numpy",
]

[project.scripts]
"{{ cookiecutter.package_name }}" = "{{ cookiecutter.package_name }}.main:entrypoint"

# Version is derived from git tags via hatch-vcs. Tag a release (e.g. `git tag
# v0.1.0`) to set the version; between tags it is inferred from the latest tag
# plus commit distance. `raw-options.root` points at the repository root one
# level up, since this package lives in the `app/` subdirectory of the monorepo.
# `fallback-version` keeps builds working when git metadata is unavailable
# (e.g. building from an sdist or outside a checkout).
[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0+unknown"
raw-options = { root = ".." }

[tool.hatch.build.hooks.vcs]
version-file = "{{ cookiecutter.package_name }}/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["{{ cookiecutter.package_name }}"]
