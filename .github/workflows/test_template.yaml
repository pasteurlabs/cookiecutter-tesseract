name: Test Template

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  structural-tests:
    # Render the template and inspect the result (no Docker), so these run
    # on every supported OS.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: pip install cookiecutter tesseract-core pytest

      - name: Run structural tests
        run: pytest -m "not e2e"

  e2e-tests:
    # Renders the template and drives the real make new/build/test/run workflow
    # against Docker (preinstalled on GitHub-hosted ubuntu runners), including
    # the RECIPE=base|jax|pytorch matrix.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: pip install cookiecutter tesseract-core pytest

      - name: Run end-to-end tests
        run: pytest -m e2e
